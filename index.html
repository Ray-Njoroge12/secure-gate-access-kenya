<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- App Information -->
    <title>Secure Gate Access Kenya</title>
    <meta name="description" content="Secure visitor management system for residential communities in Kenya with QR code scanning and PIN entry" />
    <meta name="author" content="Secure Gate Access Team" />
    <meta name="keywords" content="security, gate access, visitor management, Kenya, QR code, PIN entry" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gate Access" />
    <link rel="apple-touch-icon" href="/placeholder.svg" />
    
    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />
    
    <!-- Social Media -->
    <meta property="og:title" content="Secure Gate Access Kenya" />
    <meta property="og:description" content="Secure visitor management system for residential communities" />

    <meta property="og:image" content="/placeholder.svg" />
    <meta property="og:site_name" content="Secure Gate Access Kenya" />
    
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Secure Gate Access Kenya" />
    <meta name="twitter:description" content="Secure visitor management system" />
    <meta name="twitter:image" content="/placeholder.svg" />
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fwacwevimpifqvwpxquq.supabase.co" />
    <link rel="dns-prefetch" href="https://fwacwevimpifqvwpxquq.supabase.co" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js');
            console.log('SW registered:', registration);
            
            // Listen for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New version available
                    if (confirm('New version available! Reload to update?')) {
                      window.location.reload();
                    }
                  }
                });
              }
            });
          } catch (error) {
            console.log('SW registration failed:', error);
          }
        });
      }
      
      // Install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        deferredPrompt = e;
        // Show install button or banner
        console.log('App can be installed');
      });
    </script>
  </body>
</html>
